<svg xmlns="http://www.w3.org/2000/svg" width="680" height="310" viewBox="0 0 680 310" role="img" aria-labelledby="title desc">
  <title id="title">Order event routing with RabbitMQ</title>
  <desc id="desc">A publisher sends OrderPlaced to the orders fanout exchange, which sends a copy to each of the notifications and inventory queues.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#475569" stroke-width="1.5"/></marker>
  </defs>
  <rect width="680" height="310" rx="12" fill="#ffffff"/>
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M340 66 V114"/>
    <path d="M340 176 V201 H175 V239"/>
    <path d="M340 201 H505 V239"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="245" y="16" width="190" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="340" y="47" font-size="17" fill="#1e3a8a">Publisher</text>
    <text x="402" y="96" font-size="14" fill="#334155">OrderPlaced</text>
    <rect x="230" y="114" width="220" height="62" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="340" y="140" font-size="17" fill="#9a3412">orders exchange</text>
    <text x="340" y="161" font-size="14" fill="#9a3412">fanout</text>
    <rect x="15" y="209" width="150" height="26" rx="4" fill="#ffffff"/>
    <rect x="515" y="209" width="150" height="26" rx="4" fill="#ffffff"/>
    <text x="90" y="228" font-size="16" font-weight="600" fill="#0f172a">Copy of event</text>
    <text x="590" y="228" font-size="16" font-weight="600" fill="#0f172a">Copy of event</text>
    <rect x="60" y="239" width="230" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <rect x="390" y="239" width="230" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="175" y="270" font-size="17" fill="#166534">notifications queue</text>
    <text x="505" y="270" font-size="17" fill="#166534">inventory queue</text>
  </g>
</svg>
